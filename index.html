<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">

<!-- ============================================================
     SUPABASE CLIENT v2

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">

<!-- ============================================================
     CSS EXTERNO - VIA GITHUB
     ============================================================ -->
<link rel="stylesheet" href="https://raw.githubusercontent.com/TRADINGMASTEREDWIN/TRADING-MASTER/main/css/styles.css">

<style>
  /* CSS DE RESPALDO POR SI EL EXTERNO FALLA */
  body { 
    margin: 0; 
    background: #111827; 
    color: #FFFFFF; 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #vistaLogin {
    display: none;
    min-height: 100vh;
    background: #111827;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  #vistaLogin.visible {
    display: flex;
  }
  .login-container {
    background: #1F2937;
    border: 1px solid #2D3748;
    border-radius: 16px;
    padding: 48px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 16px 40px rgba(0,0,0,0.5);
  }
  .login-container h1 {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 8px;
    text-align: center;
  }
  .login-container .subtitle {
    color: #9CA3AF;
    text-align: center;
    margin-bottom: 24px;
    font-size: 12.5px;
  }
  .login-container .form-field {
    margin-bottom: 16px;
  }
  .login-container .form-field label {
    font-size: 12.5px;
    color: #9CA3AF;
    font-weight: 500;
    display: block;
    margin-bottom: 8px;
  }
  .login-container .form-field input {
    width: 100%;
    background: #111827;
    border: 1px solid #2D3748;
    color: #FFFFFF;
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
  }
  .login-container .form-field input:focus {
    border-color: #2563EB;
    outline: none;
  }
  .login-container .form-field input[type="checkbox"] {
    width: auto;
    margin-right: 8px;
  }
  .login-container .btn-primary {
    width: 100%;
    justify-content: center;
    padding: 12px;
    font-size: 14px;
    margin-top: 8px;
    background: #2563EB;
    color: #fff;
    border: 1px solid #2563EB;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
  }
  .login-container .btn-secondary {
    width: 100%;
    justify-content: center;
    padding: 12px;
    font-size: 14px;
    margin-top: 8px;
    background: transparent;
    color: #FFFFFF;
    border: 1px solid #374151;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
  }
  .login-container .login-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 16px 0;
    color: #6B7280;
    font-size: 11px;
  }
  .login-container .login-divider::before,
  .login-container .login-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #2D3748;
  }
  .login-container .forgot-link {
    display: block;
    text-align: center;
    color: #9CA3AF;
    font-size: 12.5px;
    cursor: pointer;
    margin-top: 12px;
  }
  .login-container .forgot-link:hover {
    color: #FFFFFF;
  }
  .login-container .auth-error {
    color: #EF4444;
    font-size: 12.5px;
    text-align: center;
    margin-top: 8px;
    display: none;
  }
  .login-container .auth-error.visible {
    display: block;
  }
  .login-container .auth-success {
    color: #22C55E;
    font-size: 12.5px;
    text-align: center;
    margin-top: 8px;
    display: none;
  }
  .login-container .auth-success.visible {
    display: block;
  }
  .login-container .logo-mark {
    width: 56px;
    height: 56px;
    border-radius: 10px;
    background: #2563EB;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 700;
    font-size: 26px;
    margin: 0 auto 12px;
  }
  .app {
    display: none;
    min-height: 100vh;
    background: #111827;
  }
  .app.visible {
    display: block;
  }
</style>
</head>
<body>

<!-- ============================================================
     LOGIN PAGE
     ============================================================ -->
<div id="vistaLogin">
  <div class="login-container">
    <div class="logo-mark">TM</div>
    <h1>Trading Master</h1>
    <p class="subtitle">Inicia sesión para gestionar tu bitácora de trading</p>

    <div id="authError" class="auth-error"></div>
    <div id="authSuccess" class="auth-success"></div>

    <div class="form-field">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" placeholder="tu@email.com">
    </div>

    <div class="form-field">
      <label for="loginPassword">Contraseña</label>
      <input type="password" id="loginPassword" placeholder="••••••••">
    </div>

    <div class="form-field" style="display: flex; align-items: center; gap: 8px;">
      <input type="checkbox" id="rememberMe" checked style="width: auto; margin: 0;">
      <label for="rememberMe" style="margin: 0; cursor: pointer;">Recordarme en este dispositivo</label>
    </div>

    <button class="btn-primary" id="loginBtn">Iniciar Sesión</button>
    <button class="btn-secondary" id="registerBtn">Registrarse</button>

    <div class="login-divider">o</div>

    <span class="forgot-link" id="forgotPasswordLink">¿Olvidaste tu contraseña?</span>
  </div>
</div>

<!-- ============================================================
     APP PRINCIPAL (VERSION SIMPLIFICADA MIENTRAS RESTAURAMOS)
     ============================================================ -->
<div class="app" id="app">
  <div style="padding: 40px; text-align: center; color: #FFFFFF;">
    <h1 style="font-size: 26px;">📊 Trading Master</h1>
    <p style="color: #9CA3AF; margin: 16px 0;">Bienvenido, <span id="userEmailDisplay">usuario</span> 👋</p>
    
    <div style="display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 30px;">
      <div style="background: #1F2937; border: 1px solid #2D3748; border-radius: 16px; padding: 24px; width: 200px;">
        <div style="font-size: 30px; font-weight: 700; color: #22C55E;">0</div>
        <div style="color: #9CA3AF; font-size: 12.5px;">Operaciones</div>
      </div>
      <div style="background: #1F2937; border: 1px solid #2D3748; border-radius: 16px; padding: 24px; width: 200px;">
        <div style="font-size: 30px; font-weight: 700; color: #2563EB;">0%</div>
        <div style="color: #9CA3AF; font-size: 12.5px;">Win Rate</div>
      </div>
      <div style="background: #1F2937; border: 1px solid #2D3748; border-radius: 16px; padding: 24px; width: 200px;">
        <div style="font-size: 30px; font-weight: 700; color: #F59E0B;">0.0</div>
        <div style="color: #9CA3AF; font-size: 12.5px;">Profit Factor</div>
      </div>
    </div>
    
    <div style="margin-top: 40px;">
      <button id="logoutBtn" style="background: transparent; border: 1px solid #EF4444; color: #EF4444; border-radius: 10px; padding: 12px 24px; font-size: 14px; font-weight: 600; cursor: pointer;">Cerrar Sesión</button>
    </div>
  </div>
</div>

<!-- ============================================================
     TOAST CONTAINER
     ============================================================ -->
<div class="toast-container" id="toastContainer"></div>

<!-- ============================================================
     JAVASCRIPT COMPLETO
     ============================================================ -->
<script>
// ============================================================
// SUPABASE CONFIG
// ============================================================
const SUPABASE_URL = 'https://pxaqnmxjcmddfgihfnzm.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB4YXFubXhqY21kZGZnaWhmbnptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0Mjg0NzEsImV4cCI6MjEwMTAwNDQ3MX0.3Gqf9N3Otl4qEDbcrCkzeWrICcR2nR5T5zUh2MEVK3g';

let supabaseClient = null;
let usuarioActual = null;

try {
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  console.log('✅ Supabase client initialized');
} catch(e) {
  console.error('❌ Error initializing Supabase:', e);
}

// ============================================================
// AUTH FUNCTIONS
// ============================================================
async function signUp(email, password) {
  const errorEl = document.getElementById('authError');
  const successEl = document.getElementById('authSuccess');
  errorEl.classList.remove('visible');
  successEl.classList.remove('visible');

  try {
    const { data, error } = await supabaseClient.auth.signUp({
      email: email,
      password: password
    });

    if (error) {
      errorEl.textContent = error.message;
      errorEl.classList.add('visible');
      return false;
    }

    successEl.textContent = '✅ Usuario registrado. Revisa tu email para confirmar.';
    successEl.classList.add('visible');
    return true;
  } catch (error) {
    errorEl.textContent = 'Error al registrar: ' + error.message;
    errorEl.classList.add('visible');
    return false;
  }
}

async function signIn(email, password) {
  const errorEl = document.getElementById('authError');
  const successEl = document.getElementById('authSuccess');
  errorEl.classList.remove('visible');
  successEl.classList.remove('visible');

  try {
    const rememberMe = document.getElementById('rememberMe').checked;

    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (error) {
      errorEl.textContent = error.message;
      errorEl.classList.add('visible');
      return false;
    }

    if (data.user) {
      if (rememberMe && data.session) {
        await supabaseClient.auth.setSession({
          access_token: data.session.access_token,
          refresh_token: data.session.refresh_token
        });
      }
      
      usuarioActual = data.user;
      showApp();
      document.getElementById('userEmailDisplay').textContent = data.user.email;
      return true;
    }
    return false;
  } catch (error) {
    errorEl.textContent = 'Error al iniciar sesión: ' + error.message;
    errorEl.classList.add('visible');
    return false;
  }
}

async function signOut() {
  try {
    await supabaseClient.auth.signOut();
    usuarioActual = null;
    showLoginPage();
    document.getElementById('loginEmail').value = '';
    document.getElementById('loginPassword').value = '';
    console.log('👋 Sesión cerrada');
  } catch (error) {
    console.error('Error al cerrar sesión:', error);
  }
}

async function resetPassword(email) {
  const errorEl = document.getElementById('authError');
  const successEl = document.getElementById('authSuccess');
  errorEl.classList.remove('visible');
  successEl.classList.remove('visible');

  try {
    const { data, error } = await supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + window.location.pathname
    });

    if (error) {
      errorEl.textContent = error.message;
      errorEl.classList.add('visible');
      return false;
    }

    successEl.textContent = '📧 Email de recuperación enviado. Revisa tu bandeja de entrada.';
    successEl.classList.add('visible');
    return true;
  } catch (error) {
    errorEl.textContent = 'Error al enviar recuperación: ' + error.message;
    errorEl.classList.add('visible');
    return false;
  }
}

async function getCurrentUser() {
  try {
    const { data: { user }, error } = await supabaseClient.auth.getUser();
    if (error || !user) return null;
    usuarioActual = user;
    return user;
  } catch (error) {
    return null;
  }
}

function showLoginPage() {
  document.getElementById('vistaLogin').classList.add('visible');
  document.getElementById('app').classList.remove('visible');
}

function showApp() {
  document.getElementById('vistaLogin').classList.remove('visible');
  document.getElementById('app').classList.add('visible');
}

// ============================================================
// INICIALIZAR AUTH
// ============================================================
async function initAuth() {
  const user = await getCurrentUser();
  if (user) {
    showApp();
    document.getElementById('userEmailDisplay').textContent = user.email;
  } else {
    showLoginPage();
  }

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    if (!email || !password) {
      document.getElementById('authError').textContent = 'Por favor, completa todos los campos.';
      document.getElementById('authError').classList.add('visible');
      return;
    }
    await signIn(email, password);
  });

  document.getElementById('registerBtn').addEventListener('click', async () => {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    if (!email || !password) {
      document.getElementById('authError').textContent = 'Por favor, completa todos los campos.';
      document.getElementById('authError').classList.add('visible');
      return;
    }
    if (password.length < 6) {
      document.getElementById('authError').textContent = 'La contraseña debe tener al menos 6 caracteres.';
      document.getElementById('authError').classList.add('visible');
      return;
    }
    await signUp(email, password);
  });

  document.getElementById('forgotPasswordLink').addEventListener('click', async () => {
    const email = document.getElementById('loginEmail').value.trim();
    if (!email) {
      document.getElementById('authError').textContent = 'Ingresa tu email para recuperar la contraseña.';
      document.getElementById('authError').classList.add('visible');
      return;
    }
    await resetPassword(email);
  });

  document.getElementById('logoutBtn').addEventListener('click', signOut);

  document.getElementById('loginPassword').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('loginBtn').click();
  });
  document.getElementById('loginEmail').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('loginPassword').focus();
  });

  const hashParams = new URLSearchParams(window.location.hash.substring(1));
  if (hashParams.get('type') === 'recovery') {
    const accessToken = hashParams.get('access_token');
    if (accessToken) {
      try {
        await supabaseClient.auth.setSession({
          access_token: accessToken,
          refresh_token: hashParams.get('refresh_token') || ''
        });
        console.log('✅ Sesión restaurada desde recuperación');
        window.location.hash = '';
        window.location.reload();
      } catch (error) {
        console.error('Error al restaurar sesión:', error);
      }
    }
  }
}

// ============================================================
// ARRANQUE
// ============================================================
(async function start() {
  await initAuth();
  console.log('✅ Trading Master iniciado correctamente');
})();
</script>

</body>
</html>
